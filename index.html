<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#140509"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>사신의 선정 게임</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080205;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;touch-action:manipulation;color:#fff}.game{position:absolute;width:min(100vw,150vh);aspect-ratio:3/2;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#090307 url('scene.jpg') center/100% 100% no-repeat;box-shadow:0 0 60px #000}.capsule{position:absolute;top:32%;height:36%;width:15%;border-radius:40% 40% 15% 15%;pointer-events:none;transition:filter .12s,opacity .2s}.capsule:nth-of-type(1){left:9%}.capsule:nth-of-type(2){left:26%}.capsule:nth-of-type(3){left:43%}.capsule:nth-of-type(4){left:60%}.capsule:nth-of-type(5){left:77%}.capsule.hot{background:linear-gradient(transparent 15%,#ff002a22 65%,#ff002a77);box-shadow:inset 0 0 45px #ff194a,0 0 30px #ff174c;filter:brightness(1.5)}.capsule.safe{background:#000b;filter:grayscale(1);opacity:.82}.capsule.win{box-shadow:0 0 40px 18px #ff003f,inset 0 0 50px #ff002b;animation:winpulse .4s infinite alternate}.label{position:absolute;top:51%;width:16%;height:11%;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,2.4vw,32px);font-weight:900;text-shadow:0 2px 5px #000;pointer-events:none}.label.safe{text-decoration:line-through;color:#8b7d80}.label.win{color:#fff8b3;text-shadow:0 0 20px red}.button{position:absolute;left:39%;top:72%;width:22%;height:20%;border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:5;touch-action:manipulation}.button:disabled{cursor:default}.reset{position:absolute;right:1.5%;top:2%;z-index:10;border:1px solid #ad334a;border-radius:8px;background:#12040bd9;color:white;padding:7px 12px;font-size:clamp(10px,1.3vw,17px)}.sound{position:absolute;left:1.5%;top:2%;z-index:10;border:1px solid #ad334a;border-radius:8px;background:#12040bd9;color:white;padding:7px 12px;font-size:clamp(10px,1.3vw,17px)}.status{position:absolute;left:26%;bottom:1.5%;width:48%;text-align:center;background:#100308e8;border:1px solid #c82443;border-radius:8px;padding:6px;font-size:clamp(10px,1.6vw,20px);font-weight:900;z-index:8}.result{position:absolute;inset:18% 11%;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(#590b21f5,#090208fa);border:3px solid #ff294a;border-radius:20px;box-shadow:0 0 65px #ed183b;z-index:12;animation:reveal .5s ease-out}.result .title{font-size:clamp(15px,3vw,43px);color:#ff6b80;letter-spacing:.13em}.result .name{font-size:clamp(48px,10vw,140px);font-weight:1000;text-shadow:0 0 45px #ff1849}.result button{background:#b51c3b;border:1px solid #ff7b93;border-radius:10px;padding:10px 25px;color:#fff;font-size:clamp(12px,1.7vw,23px);font-weight:900}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:11}.flash.on{animation:flash .3s ease-out}.shake{animation:shake .09s infinite}.sparks{position:absolute;inset:0;pointer-events:none;z-index:13;overflow:hidden}.spark{position:absolute;width:6px;height:14px;background:#f33;top:-10%;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(780deg);opacity:0}}@keyframes flash{0%{opacity:.9}100%{opacity:0}}@keyframes shake{50%{translate:2px -2px}}@keyframes winpulse{to{filter:brightness(1.9);box-shadow:0 0 65px 25px #ff174e}}@keyframes reveal{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (orientation:portrait){.game{width:100dvh;height:100dvw;aspect-ratio:auto;transform:translate(-50%,-50%) rotate(90deg)}.label{font-size:clamp(13px,3.1vh,30px)}.status{font-size:clamp(12px,2vh,22px)}.result .name{font-size:clamp(55px,12vh,140px)}.reset,.sound{font-size:12px}}
</style></head><body><main class="game" id="game" aria-label="사신의 선정 게임"><div id="capsules"></div><div id="labels"></div><button class="sound" id="sound">🔊 효과음 ON</button><button class="reset" id="reset">↻ 초기화</button><button class="button" id="start" aria-label="선정 시작"></button><div class="status" id="status">중앙의 붉은 버튼을 누르세요</div><div class="flash" id="flash"></div><div class="sparks" id="sparks"></div><div class="result" id="result"><div class="title">☠ THE CHOSEN ONE ☠</div><div class="name" id="winner"></div><button id="again">다시 선정하기</button></div></main><script>
(()=>{const names=['형환','형욱','현호','정오','명관'];const $=id=>document.getElementById(id);const caps=[],labels=[];for(let i=0;i<5;i++){const c=document.createElement('div');c.className='capsule';c.style.left=(9+17*i)+'%';$('capsules').appendChild(c);caps.push(c);const l=document.createElement('div');l.className='label';l.style.left=(8.5+17*i)+'%';l.textContent=names[i];$('labels').appendChild(l);labels.push(l)}let token=0,busy=false,muted=false,audio;function tone(f=180,d=.12,kind='sawtooth',v=.045){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=kind;o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}const wait=ms=>new Promise(r=>setTimeout(r,ms));function rand(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}function reset(){token++;busy=false;caps.forEach(c=>c.className='capsule');labels.forEach(l=>l.className='label');$('status').textContent='중앙의 붉은 버튼을 누르세요';$('result').style.display='none';$('start').disabled=false;$('game').classList.remove('shake');$('sparks').innerHTML=''}function blink(){const el=$('flash');el.classList.remove('on');void el.offsetWidth;el.classList.add('on')}function confetti(){const box=$('sparks');box.innerHTML='';for(let i=0;i<100;i++){const p=document.createElement('div');p.className='spark';p.style.left=rand(100)+'%';p.style.background=['#ff2249','#f9c065','#fff','#a31d3b'][i%4];p.style.setProperty('--dx',(rand(220)-110)+'px');p.style.animationDelay=(rand(700)/1000)+'s';box.appendChild(p)}}async function scan(alive,duration,id){let elapsed=0;while(elapsed<duration&&id===token){caps.forEach(c=>c.classList.remove('hot'));const k=alive[rand(alive.length)];caps[k].classList.add('hot');tone(190+rand(400),.055);const pause=elapsed<duration*.7?100:260;await wait(pause);elapsed+=pause}caps.forEach(c=>c.classList.remove('hot'))}async function play(){if(busy)return;reset();busy=true;$('start').disabled=true;const id=token;const order=[0,1,2,3,4];for(let i=4;i>0;i--){const j=rand(i+1);[order[i],order[j]]=[order[j],order[i]]}let alive=[0,1,2,3,4];$('status').textContent='⚠ 선정 프로토콜 가동';for(let r=0;r<4;r++){if(id!==token)return;$('status').textContent=r===3?'☠ 최후의 두 후보...':'⚡ 후보 스캔 중 · '+(r+1)+'/4';await scan(alive,r===3?4400:2600,id);if(id!==token)return;const removed=order[r];caps[removed].classList.add('safe');labels[removed].classList.add('safe');alive=alive.filter(x=>x!==removed);blink();tone(80,.65,'sawtooth',.1);$('game').classList.add('shake');$('status').textContent='✕ '+names[removed]+' 제외';await wait(350);$('game').classList.remove('shake');await wait(750)}if(id!==token)return;$('status').textContent='♥ 심박 급상승 · 최종 판정 대기';for(let i=0;i<5;i++){if(id!==token)return;tone(75,.17,'sine',.17);await wait(320);tone(65,.2,'sine',.13);await wait(450)}for(let n=3;n>0;n--){if(id!==token)return;$('status').textContent='☠ '+n;tone(230+n*90,.25,'square',.06);await wait(1000)}if(id!==token)return;$('status').textContent='████ 최종 판정 ████';$('game').classList.add('shake');tone(65,1.4,'sawtooth',.11);await wait(1500);if(id!==token)return;$('game').classList.remove('shake');const chosen=alive[0];caps[chosen].classList.add('win');labels[chosen].classList.add('win');blink();confetti();$('winner').textContent=names[chosen];$('result').style.display='flex';$('status').textContent='☠ 선정 완료';for(let i=0;i<5;i++)tone(250+i*90,.2,'triangle',.06);busy=false;$('start').disabled=false} $('start').addEventListener('click',play);$('again').addEventListener('click',play);$('reset').addEventListener('click',reset);$('sound').addEventListener('click',()=>{muted=!muted;$('sound').textContent=muted?'🔇 효과음 OFF':'🔊 효과음 ON'});})();
</script></body></html>
